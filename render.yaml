services:
  - type: web
    name: deeptrack-platform
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: bash scripts/build.sh
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: AUTH0_SECRET
        sync: false
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_CLIENT_ID
        sync: false
      - key: AUTH0_CLIENT_SECRET
        sync: false
      - key: AUTH0_ROLE_CLAIM
        sync: false
      - key: AUTH0_COMPANY_ID_CLAIM
        sync: false
      - key: AUTH0_MANAGEMENT_CLIENT_ID
        sync: false
      - key: AUTH0_MANAGEMENT_CLIENT_SECRET
        sync: false
      - key: AUTH0_ORGANIZATION_ID
        sync: false
      - key: AUTH0_INVITATION_CLIENT_ID
        sync: false
      - key: AUTH0_INVITATION_CONNECTION_ID
        sync: false
      - key: NEXT_PUBLIC_CONVEX_URL
        sync: false
      - key: CONVEX_DEPLOYMENT
        sync: false
      - key: CONVEX_SITE_URL
        sync: false
      - key: DEEPTRACK_BACKEND_URL
        sync: false
      - key: OPENSANCTIONS_API_KEY
        sync: false
      - key: SHUFTI_CLIENT_ID
        sync: false
      - key: SHUFTI_SECRET_KEY
        sync: false
      - key: UPLOADTHING_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
